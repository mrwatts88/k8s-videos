# Argo CD (Episode 13) keeps the cluster matching what's in Git. Like the
# logging stack and cert-manager, k3s' Helm controller installs it from here.
apiVersion: helm.cattle.io/v1
kind: HelmChart
metadata:
  name: argo-cd
  namespace: kube-system
spec:
  repo: https://argoproj.github.io/argo-helm
  chart: argo-cd
  version: 10.11.6
  targetNamespace: argocd
  valuesContent: |-
    # Plain names: argocd-server, argocd-repo-server, and so on.
    fullnameOverride: argocd
    # The series uses the argocd CLI with kubectl's own access, so Argo CD's
    # bundled sign-in service (Dex) isn't needed.
    dex:
      enabled: false
    configs:
      tls:
        # Trust the company root CA (Episode 9) when fetching from Git.
        certificates:
          git.corp.internal: |
