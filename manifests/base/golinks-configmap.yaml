apiVersion: v1
kind: ConfigMap
metadata:
  name: golinks-config
  namespace: golinks
  labels:
    app.kubernetes.io/name: golinks
data:
  DATABASE_HOST: postgres-0.postgres  # finds the one in the pod's own namespace
  DATABASE_PORT: "5432"
  DATABASE_NAME: golinks
  DATABASE_USER: golinks
  LOG_LEVEL: info
  # Used from Episode 9 on: where tokens come from and who they are for.
  OIDC_ISSUER_URL: https://sso.corp.internal/realms/corp
  OIDC_AUDIENCE: golinks
  # The company root CA, mounted from the ConfigMap corp-root-ca, so calls to
  # sso.corp.internal over HTTPS can be checked.
  OIDC_CA_FILE: /etc/corp-ca/ca.crt
