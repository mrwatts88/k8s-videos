apiVersion: apps/v1
kind: Deployment
metadata:
  name: golinks
  namespace: golinks
  labels:
    app.kubernetes.io/name: golinks
spec:
  # No replicas here: the HorizontalPodAutoscaler owns the count (Episode 11).
  selector:
    matchLabels:
      app.kubernetes.io/name: golinks
  template:
    metadata:
      labels:
        app.kubernetes.io/name: golinks
    spec:
      containers:
        - name: golinks
          image: registry.corp.internal/platform/golinks:0.1.0
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: golinks-config
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
          # Holds off the other two probes until the app has started
          # (for example, while database migrations run).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # Failing restarts the container. Checks only the process itself.
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          # Failing takes the pod out of the Service. Checks the database too.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 128Mi
          # The company root CA as a read-only file (Episode 9).
          volumeMounts:
            - name: corp-root-ca
              mountPath: /etc/corp-ca
              readOnly: true
      volumes:
        - name: corp-root-ca
          configMap:
            name: corp-root-ca
