# k3s ships Traefik as its ingress controller. Episode 8 adds TLS at the end.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: golinks
  namespace: golinks
  labels:
    app.kubernetes.io/name: golinks
spec:
  ingressClassName: traefik
  rules:
    - host: go.corp.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: golinks
                port:
                  name: http
  # Serve HTTPS with the certificate cert-manager keeps in golinks-tls.
  tls:
    - hosts:
        - go.corp.internal
      secretName: golinks-tls
