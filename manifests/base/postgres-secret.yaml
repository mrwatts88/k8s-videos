# Example only. A real cluster keeps this out of git, for example with
# Sealed Secrets or External Secrets. stringData is base64-encoded on save,
# which is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: golinks
  labels:
    app.kubernetes.io/name: postgres
type: Opaque
stringData:
  POSTGRES_USER: golinks
  POSTGRES_PASSWORD: change-me-in-a-real-cluster
  POSTGRES_DB: golinks
