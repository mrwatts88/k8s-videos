# Logging (Episode 7): Loki stores, Alloy ships, Grafana searches. Each chart is
# installed by k3s' Helm controller; apply with kubectl apply -k manifests/logging.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - loki.yaml
  - alloy.yaml
  - grafana.yaml
